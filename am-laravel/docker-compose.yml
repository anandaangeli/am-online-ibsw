services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: am_laravel
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: am_hris
      DB_USERNAME: laravel_user
      DB_PASSWORD: password123
    volumes:
      - .:/var/www/html
      - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - am-network

  mysql:
    image: mariadb:lts
    container_name: am_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: am_hris
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: password123
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - am_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - am-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: am_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - am-network

networks:
  am-network:
    driver: bridge

volumes:
  am_mysql_data:
    driver: local

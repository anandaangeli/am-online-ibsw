<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AM Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="brand-header">
            <div class="brand-icon">
                <i class="bi bi-buildings-fill"></i>
            </div>
            <div class="brand-title">AM ONLINE</div>
            <div class="brand-desc">Budget Request & Cash Advance System</div>
            <span class="badge-hris">
                <i class="bi bi-shield-lock-fill"></i> HRIS IBSW Portal
            </span>
        </div>

        <div id="alertBox" class="alert d-none custom-alert" role="alert">
            <i id="alertIcon" class="bi bi-exclamation-triangle-fill fs-5"></i>
            <div id="alertMsg" class="flex-grow-1"></div>
        </div>

        <form id="formLogin" novalidate>
            <div class="form-floating mb-3">
                <input type="text" 
                       class="form-control" 
                       id="username" 
                       name="username" 
                       placeholder="NIK atau Email Karyawan" 
                       required 
                       autofocus>
                <label for="username">
                    <i class="bi bi-person me-1"></i> NIK Karyawan
                </label>
                <div class="invalid-feedback text-start">
                    Harap masukkan NIK karyawan.
                </div>
            </div>

            <div class="input-password-wrapper mb-4">
                <div class="form-floating">
                    <input type="password" 
                           class="form-control" 
                           id="password" 
                           name="password" 
                           placeholder="Password" 
                           required>
                    <label for="password">
                        <i class="bi bi-key me-1"></i> Password
                    </label>
                    <div class="invalid-feedback text-start">
                        Harap masukkan password.
                    </div>
                </div>
                <button type="button" class="btn-toggle-eye" id="togglePasswordBtn" aria-label="Toggle password">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>

            <button type="submit" class="btn btn-submit" id="btnSubmit">
                <span class="spinner-border spinner-border-sm d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
                <span id="btnText"><i class="bi bi-box-arrow-in-right me-1"></i> Masuk</span>
            </button>
        </form>

        <div id="userInfoBox" class="user-info-box d-none mt-3">
            <h6 class="fw-bold mb-2 text-success"><i class="bi bi-check-circle-fill me-1"></i> Login Berhasil</h6>
            <div id="userDetails" class="small text-muted"></div>
        </div>
    </div>

    <div class="login-footer">
        <p class="mb-1">&copy; 2026 PT Infrastruktur Bisnis Sejahtera</p>
        <p class="mb-0">AM Online System</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
